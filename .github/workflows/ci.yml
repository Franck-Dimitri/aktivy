# Intégration continue : chaque PR et chaque envoi sur main doivent passer ces contrôles avant fusion.
# Tests sur PostgreSQL, comme la production (SQLite en local laisse passer des écarts de SQL).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Serveur (tests PostgreSQL, Pint, PHPStan)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: motriks_test
          POSTGRES_USER: motriks
          POSTGRES_PASSWORD: motriks
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U motriks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: motriks_test
      DB_USERNAME: motriks
      DB_PASSWORD: motriks

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, gd, zip, intl, bcmath, mbstring
          coverage: none

      - name: Dépendances PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # Les pages sont rendues par Vite pendant les tests (manifeste et routes Wayfinder)
      - name: Fichiers front
        run: |
          npm ci
          npm run build

      - name: Préparer l'application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Style (Pint)
        run: vendor/bin/pint --test

      - name: Analyse statique (PHPStan, erreurs existantes figées dans phpstan-baseline.neon)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Tests
        run: php artisan test --compact

  frontend:
    name: Front (types, lint, format, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Routes générées par Wayfinder (resources/js/routes, actions) : il faut PHP pour les produire
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan wayfinder:generate --with-form

      - name: Types (TypeScript)
        run: npx tsc --noEmit

      - name: Lint et format (vp check)
        run: npx vp check

      - name: Tests (Vitest)
        run: npm test

      - name: Construction
        run: npm run build
