<!doctype html>
<!--
    Page servie par le Service Worker (sw.js) quand une page ne peut pas s'ouvrir faute de réseau.
    Elle est servie à l'adresse demandée : « Réessayer » et le retour du réseau rouvrent donc la bonne page.
    Rien d'autre n'est gardé sur le téléphone pour les responsables (données d'équipe) ; l'hôtesse peut
    rouvrir son espace gardé hors ligne (lien affiché seulement s'il existe).
    Autonome : aucun fichier externe (police, image, script), elle doit s'afficher sans réseau.
-->
<html lang="fr" style="color-scheme: light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#027a48">
    <meta name="robots" content="noindex">
    <title>Hors ligne · Motriks</title>
    <style>
        :root {
            --green: #039855;
            --green-deep: #027a48;
            --green-soft: #ecfdf3;
            --ink: #0f172a;
            --muted: #64748b;
            --line: #e2e8f0;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
            font-family: Montserrat, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(120% 60% at 50% 0%, var(--green-soft) 0%, #ffffff 60%);
            color: var(--ink);
            text-align: center;
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
        }
        main { width: 100%; max-width: 380px; }
        .brand {
            display: inline-flex; align-items: center; gap: 8px;
            font-weight: 700; font-size: 15px; letter-spacing: -0.01em; color: var(--green-deep);
            margin-bottom: 40px;
        }
        .brand i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
        .signal { position: relative; width: 96px; height: 96px; margin: 0 auto 28px; }
        .signal::before, .signal::after {
            content: ''; position: absolute; inset: 0; border-radius: 50%;
            border: 2px solid var(--green); opacity: 0;
            animation: ripple 2.4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        }
        .signal::after { animation-delay: 1.2s; }
        .signal span {
            position: absolute; inset: 14px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: #fff; color: var(--green-deep);
            box-shadow: 0 18px 40px -16px rgba(2, 122, 72, 0.45), inset 0 0 0 1px rgba(2, 122, 72, 0.12);
        }
        @keyframes ripple { 0% { transform: scale(0.7); opacity: 0.55; } 100% { transform: scale(1.35); opacity: 0; } }
        h1 { font-size: 24px; line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 10px; }
        p { color: var(--muted); font-size: 15px; line-height: 1.55; margin: 0 0 28px; }
        .status {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 13px; font-weight: 600; color: var(--muted);
            padding: 7px 14px; border-radius: 999px; background: #f8fafc; border: 1px solid var(--line);
            margin-bottom: 28px;
        }
        .status i { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; animation: blink 1.4s ease-in-out infinite; }
        .status.ok { color: var(--green-deep); background: var(--green-soft); border-color: #abefc6; }
        .status.ok i { background: var(--green); animation: none; }
        @keyframes blink { 50% { opacity: 0.25; } }
        .actions { display: flex; flex-direction: column; gap: 10px; }
        button, a.secondary {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; min-height: 52px; padding: 0 18px; border-radius: 16px;
            font: inherit; font-size: 15px; font-weight: 600; text-decoration: none; cursor: pointer;
            touch-action: manipulation; user-select: none; -webkit-user-select: none;
            transition: transform 0.15s ease, background-color 0.15s ease;
        }
        button { border: 0; background: var(--green); color: #fff; box-shadow: 0 10px 24px -12px rgba(3, 152, 85, 0.8); }
        button:active, a.secondary:active { transform: scale(0.97); }
        button:disabled { opacity: 0.7; }
        button svg.spin { animation: spin 0.9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        a.secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); }
        a.secondary[hidden] { display: none; }
        .tips { margin-top: 32px; font-size: 13px; color: #94a3b8; line-height: 1.5; }
        @media (prefers-reduced-motion: reduce) {
            .signal::before, .signal::after, .status i { animation: none; }
        }
    </style>
</head>
<body>
    <main>
        <div class="brand"><i></i>Motriks</div>

        <div class="signal" aria-hidden="true">
            <span>
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h.01" /><path d="M8.5 16.429a5 5 0 0 1 7 0" /><path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
                    <path d="M19 12.859a10 10 0 0 0-2.007-1.523" /><path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
                    <path d="M22 8.82a15 15 0 0 0-11.288-3.764" /><path d="m2 2 20 20" />
                </svg>
            </span>
        </div>

        <h1>Vous n’êtes pas connecté</h1>
        <p>Cette page a besoin d’Internet pour s’afficher. Elle s’ouvrira toute seule dès que le réseau revient.</p>

        <div class="status" id="status" role="status" aria-live="polite"><i></i><span>En attente du réseau…</span></div>

        <div class="actions">
            <button type="button" id="retry">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" />
                    <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M8 16H3v5" />
                </svg>
                <span>Réessayer</span>
            </button>
            <a class="secondary" id="terrain" href="/terrain" hidden>Ouvrir mon espace hôtesse</a>
        </div>

        <p class="tips">Vérifiez que les données mobiles ou le Wi-Fi sont activés.</p>
    </main>

    <script>
        (function () {
            var status = document.getElementById('status');
            var retry = document.getElementById('retry');
            var icon = retry.querySelector('svg');
            var busy = false;

            // Espace hôtesse gardé hors ligne sur ce téléphone : il peut s'ouvrir sans réseau
            if (window.caches) {
                caches.open('motriks-pages-v1')
                    .then(function (cache) { return cache.match('/terrain'); })
                    .then(function (page) { if (page) document.getElementById('terrain').hidden = false; })
                    .catch(function () {});
            }

            function back() {
                status.className = 'status ok';
                status.lastElementChild.textContent = 'Connexion rétablie · ouverture…';
                window.location.reload();
            }

            // Internet répond vraiment (pas seulement « réseau présent ») : on rouvre la page demandée
            function check(manual) {
                if (busy) return;
                busy = true;
                if (manual) { retry.disabled = true; icon.setAttribute('class', 'spin'); }
                fetch('/up', { cache: 'no-store', credentials: 'same-origin' })
                    .then(function (response) { if (response.status < 500) back(); else throw new Error(); })
                    .catch(function () {
                        if (manual) status.lastElementChild.textContent = 'Toujours pas de réseau · nouvel essai automatique';
                    })
                    .then(function () {
                        busy = false;
                        retry.disabled = false;
                        icon.removeAttribute('class');
                    });
            }

            retry.addEventListener('click', function () { check(true); });
            window.addEventListener('online', function () { check(false); });
            setInterval(function () {
                if (navigator.onLine && document.visibilityState === 'visible') check(false);
            }, 8000);
        })();
    </script>
</body>
</html>
